[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "JCMBSoft-Python-Library"
version = "2.02"
description = "JCMBsoft Python Library"
readme = "README"
authors = [{ name = "JCMBsoft", email = "Geoffrey@jcmbsoft.com" }]
license = { text = "For JCMBsoft code, MIT For Trimble, GPL V3 for everyone else. Other code per orginal source" }
requires-python = ">=3.8"
urls = { Homepage = "https://jcmbsoft.com/" }

[tool.setuptools.packages.find]
where = ["."]
include = ["JCMBSoftPyLib*"]
exclude = ["test*", "to_upgrade_to_p3*", "build*", "dist*"]
